name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar manifiesto con la versión de la release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg repo "$REPO" --arg tag "$TAG" '
            .version = $v
            | .url = "https://github.com/\($repo)"
            | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json"
            | .download = "https://github.com/\($repo)/releases/download/\($tag)/module.zip"
            | .license = "https://github.com/\($repo)/blob/main/LICENSE"
            | .bugs = "https://github.com/\($repo)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Empaquetar módulo
        run: zip -r module.zip module.json languages packs scripts styles README.md

      - name: Subir archivos a la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
